name: collect

on:
  schedule:
    - cron: "43 */3 * * *"   # every 3 hours, off-peak minute (GitHub delays or drops runs scheduled at busy times)
    - cron: "03 14 19 10 *"  # TEST one-shot, remove after check
  workflow_dispatch: {}       # manual run from the Actions tab

permissions:
  contents: write             # needed to commit data/relevant.jsonl

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run veille import
      - run: uv run veille collect --days 2
      - run: uv run veille export
      - name: Commit and push new data (safe against concurrent pushes)
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          bash scripts/push_data.sh
